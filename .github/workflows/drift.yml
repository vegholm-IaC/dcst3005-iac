# =============================================================================
#  .github/workflows/drift.yml  –  har dev glidd fra koden?
# -----------------------------------------------------------------------------
#  Kjører terraform plan mot dev på et fast tidspunkt og blir RØD hvis Azure
#  ikke stemmer med koden på main. Den retter ingenting – den melder fra.
#
#  Husk hva den ikke ser: ressurser som ikke står i state, og egenskaper
#  koden ikke nevner (side 3). Grønn betyr «det Terraform eier, stemmer».
# =============================================================================

name: Drift dev

on:
  schedule:
    # 11.00 UTC mandag–fredag: 13.00 sommertid, 12.00 vintertid.
    # Etter at dev er rullet ut, og lenge før ryddejobben i natt.
    - cron: '0 11 * * 1-5'
  # Samme sjekk når du vil – uten å vente på klokka.
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  sjekk:
    name: drift-sjekk dev
    runs-on: ubuntu-latest

    # Dev sin identitet i Azure, akkurat som CD dev og plan-dev.
    environment: dev

    defaults:
      run:
        working-directory: oppgave-2/stacks/webapp/nettverk

    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_INPUT: false
      TF_IN_AUTOMATION: true

    steps:
      - name: Hent koden
        uses: actions/checkout@v5

      - name: Installer Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Logg inn i Azure
        uses: Azure/login@v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Hent parameterfila for dev
        run: |
          az keyvault secret show \
            --vault-name "${{ secrets.KEYVAULT_NAME }}" \
            --name "tfvars-dev" \
            --query value -o tsv > params.auto.tfvars

      - name: Init
        run: |
          terraform init \
            -backend-config="${{ github.workspace }}/oppgave-2/shared/backend.hcl" \
            -backend-config="key=env/dev/webapp/nettverk.tfstate"

      # Kjernen i hele workflowen. Tre detaljer, alle med vilje:
      #   set +e   – ellers stopper steget ved exit-kode 2 (bash -e)
      #   > fil    – IKKE en pipe; da ville vi fått exit-koden til tee/grep
      #   -lock=false – planen skriver ingenting og skal ikke blokkere CD dev
      - name: Plan med detaljert exit-kode
        id: plan
        run: |
          set +e
          terraform plan -lock=false -no-color -detailed-exitcode > plan.txt 2>&1
          kode=$?
          set -e
          cat plan.txt
          echo "kode=$kode" >> "$GITHUB_OUTPUT"

      - name: Slett parameterfila
        if: always()
        run: rm -f params.auto.tfvars

      # Sammendraget havner øverst på kjøringen. Det er det du leser først.
      - name: Skriv sammendrag
        if: always()
        env:
          KODE: ${{ steps.plan.outputs.kode }}
        run: |
          {
            case "$KODE" in
              0) echo "## ✅ Ingen drift i dev" ;;
              2) echo "## ⚠️ Drift i dev – Azure stemmer ikke med main" ;;
              *) echo "## ❌ Drift-sjekken feilet – se loggen" ;;
            esac
            echo
            grep -E '^(Plan:|No changes)' plan.txt || true
            echo
            echo "<details><summary>Hele planen</summary>"
            echo
            echo '```text'
            cat plan.txt 2>/dev/null || true
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      # Til slutt: gjør jobben rød hvis det var drift (2) eller feil (1).
      - name: Rød ved drift
        env:
          KODE: ${{ steps.plan.outputs.kode }}
        run: |
          if [ "$KODE" != "0" ]; then
            echo "::error::Drift-sjekken ga exit-kode $KODE – se sammendraget."
            exit 1
          fi
