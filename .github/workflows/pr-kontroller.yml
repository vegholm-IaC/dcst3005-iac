name: PR-kontroller

on:
  pull_request:
    branches: [main]
    paths:
      - 'oppgave-2/**'
      - '.github/workflows/pr-kontroller.yml'

permissions:
  contents: read

jobs:
  kontroller:
    name: fmt og validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0

      - name: Sjekk formatering
        run: terraform fmt -check -recursive

      - name: Klargjør providere uten backend
        working-directory: oppgave-2/stacks/webapp
        run: terraform init -backend=false

      - name: Valider koden
        working-directory: oppgave-2/stacks/webapp
        run: terraform validate
