name: Rull ut webapp

on:
  push:
    branches: [main]
    paths:
      - 'oppgave-2/stacks/webapp/**'
      - '.github/workflows/webapp.yml'

  workflow_dispatch:
    inputs:
      environment:
        description: Hvilket miljø skal rulles ut
        type: choice
        options: [dev, test, prod]
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: webapp-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    defaults:
      run:
        working-directory: oppgave-2/stacks/webapp/nettverk

    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_INPUT: false
      TF_IN_AUTOMATION: true

    steps:
      - name: Hent koden
        uses: actions/checkout@v5

      - name: Installer Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Logg inn i Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Hent parameterfila for miljøet
        run: |
          az keyvault secret show \
            --vault-name "${{ secrets.KEYVAULT_NAME }}" \
            --name "tfvars-${{ inputs.environment }}" \
            --query value -o tsv > params.auto.tfvars

      - name: Init
        run: |
          terraform init \
            -backend-config="${{ github.workspace }}/oppgave-2/shared/backend.hcl" \
            -backend-config="key=env/${{ inputs.environment }}/webapp.tfstate"

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan

      - name: Apply
        run: terraform apply -auto-approve

      - name: Slett parameterfila
        if: always()
        run: rm -f params.auto.tfvars
