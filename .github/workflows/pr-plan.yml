name: PR-plan

on:
  pull_request:
    branches: [main]
    paths:
      - 'oppgave-2/**'

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: pr-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: dev

    defaults:
      run:
        working-directory: oppgave-2/stacks/webapp

    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_INPUT: false
      TF_IN_AUTOMATION: true

    steps:
      - name: Hent koden
        uses: actions/checkout@v5

      - name: Installer Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Logg inn i Azure
        uses: Azure/login@v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Hent parameterfila for dev
        run: |
          az keyvault secret show \
            --vault-name "${{ secrets.KEYVAULT_NAME }}" \
            --name "tfvars-dev" \
            --query value -o tsv > params.auto.tfvars

      - name: Init
        run: |
          terraform init \
            -backend-config="${{ github.workspace }}/oppgave-2/shared/backend.hcl" \
            -backend-config="key=env/dev/webapp/nettverk.tfstate"

      - name: Plan
        run: terraform plan -lock=false -no-color -out=tfplan
      
      - name: Legg planen som kommentar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## Terraform plan – dev"
            echo
            echo "<details><summary>Vis hele planen</summary>"
            echo
            echo '```terraform'
            terraform show -no-color tfplan
            echo '```'
            echo
            echo "</details>"
          } > "${{ github.workspace }}/kommentar.md"

          gh pr comment "${{ github.event.pull_request.number }}" \
            --body-file "${{ github.workspace }}/kommentar.md"
      - name: Slett parameterfila
        if: always()
        run: rm -f params.auto.tfvars
